<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3.0">
</head>
<body>
  <div class="shell">

    <!-- Header: barra de diagnóstico -->
    <header class="deck-bar" id="header">
      <div class="wordmark" aria-hidden="true">
        <span class="wordmark-glyph">◆</span>
        <span class="wordmark-text">KAREN</span>
      </div>

      <div class="readout" id="status-indicator">
        <span class="readout-dot offline" id="status-dot"></span>
        <span class="readout-text" id="status-text">offline</span>
        <span class="readout-sep">·</span>
        <span class="readout-model" id="status-model">sem modelo</span>
      </div>

      <label class="model-picker" title="Escolher modelo da Karen">
        <span>modelo</span>
        <select id="model-select" aria-label="Escolher modelo da Karen"></select>
      </label>

      <div class="win-controls">
        <button class="win-btn" id="btn-always-on-top" type="button" title="Sempre no topo" aria-label="Sempre no topo">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L12 14 M8 6 L16 6 M6 14 L18 14 L15 22 L9 22 Z"/></svg>
        </button>
        <button class="win-btn" id="btn-fullscreen" type="button" title="Tela cheia" aria-label="Tela cheia">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
        </button>
        <button class="win-btn" id="btn-minimize" type="button" title="Minimizar" aria-label="Minimizar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="12" x2="20" y2="12"/></svg>
        </button>
        <button class="win-btn win-btn-close" id="btn-close" type="button" title="Fechar para bandeja" aria-label="Fechar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
        </button>
      </div>
    </header>

    <!-- Log da conversa -->
    <main class="log" id="chat-container">
      <div class="intro" id="welcome-message">
        <div class="intro-glyph">◆</div>
        <h1>O que vamos resolver hoje?</h1>
        <p>Comandos diretos funcionam melhor. Alguns exemplos:</p>
        <div class="chip-row" id="chip-row">
          <button class="chip" type="button" data-command="Abre o Chrome e vai para o YouTube">
            <span class="chip-glyph">↗</span> abrir Chrome no YouTube
          </button>
          <button class="chip" type="button" data-command="Cria um arquivo de texto na área de trabalho">
            <span class="chip-glyph">＋</span> criar arquivo na área de trabalho
          </button>
          <button class="chip" type="button" data-command="Tira um screenshot da tela">
            <span class="chip-glyph">▣</span> tirar screenshot
          </button>
          <button class="chip" type="button" data-command="Envia mensagem no WhatsApp para João">
            <span class="chip-glyph">▸</span> mandar WhatsApp
          </button>
          <button class="chip" type="button" data-command="Qual a previsão do tempo?">
            <span class="chip-glyph">☁</span> ver o clima
          </button>
        </div>
      </div>
      <div class="entries" id="messages"></div>
    </main>

    <!-- Command deck: input -->
    <footer class="deck-bar deck-bar-input">
      <div class="command-line">
        <span class="prompt-caret">❯</span>
        <textarea
          id="message-input"
          placeholder="Digite um comando ou pergunta…"
          rows="1"
        ></textarea>
        <div class="command-tools">
          <button class="tool-btn" id="btn-screenshot" type="button" title="Anexar screenshot" aria-label="Anexar screenshot">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8 L6.5 8 L8 5.5 L16 5.5 L17.5 8 L20 8 L20 19 L4 19 Z"/><circle cx="12" cy="13" r="3.2"/></svg>
          </button>
          <button class="tool-btn" id="btn-clear" type="button" title="Nova conversa" aria-label="Nova conversa">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7 L19 7 M9 7 L9.5 4.5 L14.5 4.5 L15 7 M7 7 L7.8 19 L16.2 19 L17 7"/></svg>
          </button>
          <button class="send-btn" id="btn-send" type="button" disabled title="Enviar" aria-label="Enviar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12 L19 12 M13 6 L19 12 L13 18"/></svg>
          </button>
        </div>
      </div>
      <div class="deck-hint"><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> quebra linha</div>
    </footer>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
